<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">Q Platform — Built for the exam. Designed for what comes next.</title>
<desc id="desc">An IITM BS mock examination platform serving 85 real users. Author, attempt, evaluate, improve.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1021"/><stop offset="1" stop-color="#18253f"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
</defs>
<rect width="1280" height="400" rx="22" fill="url(#bg)"/>
<rect width="1280" height="400" rx="22" fill="url(#grid)"/>
<circle cx="1140" cy="70" r="210" fill="#14b8a6" opacity=".045"/>
<rect x="56" y="48" width="5" height="25" rx="2" fill="#5eead4"/>
<text x="77" y="67" fill="#5eead4" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">Q PLATFORM</text>
<text x="56" y="151" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Built for the exam.</text>
<text x="56" y="216" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="-1.5">Designed for what comes next.</text>
<text x="58" y="267" fill="#b4c3d7" font-family="Arial, Helvetica, sans-serif" font-size="19">IITM BS mock exams, from the first question to the final insight.</text>
