<text x="80" y="337" fill="#d6e3f3" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">AUTHOR  /  ATTEMPT  /  EVALUATE  /  IMPROVE</text>
<rect x="973" y="110" width="240" height="181" rx="20" fill="#081423" fill-opacity=".7" stroke="#5eead4" stroke-opacity=".22"/>
<circle cx="1001" cy="139" r="4" fill="#5eead4"/>
<text x="1014" y="144" fill="#7dd3c7" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2">IN REAL USE</text>
<text x="997" y="224" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-4">85</text>
<text x="1000" y="257" fill="#a8bdd5" font-family="Arial, Helvetica, sans-serif" font-size="16">real users</text>
